<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soumet Rent Tracker</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; color: #333; }
        h1 { font-size: 2.5rem; text-align: center; }
        .card { background: #fff; padding: 20px; margin: 15px 0; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 15px; margin: 10px 0; font-size: 1.2rem; border-radius: 10px; border: 1px solid #ccc; }
        button { background: #2c3e50; color: white; font-weight: bold; }
        .balance { font-size: 1.5rem; color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Rent Manager</h1>
    <div class="card">
        <form action="/add" method="POST">
            <input type="text" name="name" placeholder="Tenant Name" required>
            <input type="number" name="total" placeholder="Total Rent" required>
            <input type="number" name="paid" placeholder="Amount Paid" required>
            <input type="date" name="move" required>
            <input type="date" name="exp" required>
            <button type="submit">Add Tenant</button>
        </form>
    </div>
    {% for t in tenants %}
    <div class="card">
        <h2>{{ t.name }}</h2>
        <p>Rent: {{ t.rent_total }} | Paid: {{ t.amount_paid }}</p>
        <p class="balance">Balance: {{ t.outstanding_balance }}</p>
        <a href="/receipt/{{ t.id }}">View Receipt</a>
    </div>
    {% endfor %}
</body>
</html>
